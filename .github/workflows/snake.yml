name: generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test profile asset pipeline
        run: python3 -m unittest discover -s tests -v

      - name: Generate custom SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEFORCES_HANDLE: SobaDango
        run: python3 scripts/generate_profile_assets.py --out-dir dist

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F5C16C&color_dots=%230D1117,%2317212B,%23312E2B,%237DD3FC,%23F472B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F5C16C&color_dots=%230D1117,%2317212B,%23312E2B,%237DD3FC,%23F472B6

      - name: Grow snake as contributions are eaten
        run: |
          python3 scripts/grow_contribution_snake.py \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg

      - name: Validate published assets
        run: python3 scripts/validate_profile_assets.py --asset-dir dist --readme README.md

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
